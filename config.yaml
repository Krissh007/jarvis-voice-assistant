# JARVIS configuration. Secrets go in .env, never here.

user:
  name: Sir                     # how JARVIS addresses you

voice:
  name: Charon                  # Live API prebuilt voice (accent/tone come from the persona prompt)

models:
  live: gemini-3.8-live         # stable Live model, free tier (docs checked 2026-09-24)
  flash: gemini-3.8-flash       # text sub-tasks, free tier (docs checked 2026-09-24)
  flash_fallbacks: [gemini-3.5-flash, gemini-3.5-flash-lite]   # tried in order when flash is overloaded
  thinking:                     # thinking level per text model (lower = faster); measured 2026-09-25
    gemini-3.8-flash: low       # 3.8 rejects "minimal"
    gemini-3.5-flash: minimal
    gemini-3.5-flash-lite: minimal
  openrouter: null              # e.g. a free OpenRouter model id; used only if OPENROUTER_API_KEY is set

listening:
  mode: wake_word               # always_on | push_to_talk | wake_word

wake_word:
  model: hey_jarvis
  threshold: 0.3                # lowered from 0.5: best score in the first mic test was 0.41
  active_window_s: 15

audio:
  transcription_languages: [en-IN]   # BCP-47 hints for your speech; [] = auto-detect
  input_device: null            # null = Windows default; or part of a device name, e.g. "Nord Buds"
  echo_mode: auto               # auto | headphones | speakers. auto guesses from the output device name.
                                # speakers: mic ignored while JARVIS talks (interrupt with the stop key)
  mute_mic_while_speaking: false
  echo_tail_ms: 400

hotkeys:
  mute: ctrl+alt+m
  push_to_talk: ctrl+alt+space
  stop: ctrl+alt+s
  confirm: ctrl+alt+y
  cancel: ctrl+alt+n

confirm:
  accept_phrases: [confirm, "yes", yes do it, go ahead, yeah, yep, sure, okay, ok]
  timeout_s: 20

apps:
  # friendly name -> what Windows should launch (App Paths names or a URL). Only these can be opened.
  allowlist:
    chrome: chrome.exe
    vs code: code.exe
    notepad: notepad.exe
    calculator: calc.exe
    file explorer: explorer.exe
    terminal: wt.exe
    word: winword.exe
    excel: excel.exe
  # other ways of saying the same app (exact match after lower-casing; nothing is guessed)
  aliases:
    google chrome: chrome
    browser: chrome
    visual studio code: vs code
    vscode: vs code
    code: vs code
    calc: calculator
    explorer: file explorer
    files: file explorer
    my files: file explorer
    windows terminal: terminal
    command prompt: terminal
    powershell: terminal
    microsoft word: word
    ms word: word
    microsoft excel: excel
    ms excel: excel

sites:
  read_allowlist: [youtube.com, music.youtube.com, google.com, wikipedia.org]
  action_allowlist: [youtube.com, music.youtube.com, google.com, wikipedia.org]

weather:
  default_city: null            # used when you ask "what's the weather?" without a city

browser:
  channel: chrome               # your installed Google Chrome, with JARVIS's own profile in data/browser_profile
  headless: false               # show the window (needed to hear and see what it plays)

music:
  source: youtube_music

paths:
  research_dir: '%USERPROFILE%\Documents\jarvis'

limits:
  # Google no longer publishes free-tier numbers in the docs; they are shown per account at
  # https://aistudio.google.com/rate-limit . Copy yours here; null = no client-side limit.
  live: {rpm: null, tpm: null, rpd: null}
  flash: {rpm: null, tpm: null, rpd: 20}   # gemini-3.8-flash free tier: 20/day (from the API's 429, 2026-09-25)
  research_pages_max: 3
  agent_steps_max: 10
  agent_replans_max: 1
  browser_task_steps_max: 10
  page_cache_ttl_h: 24

features:
  test_tools: true              # Phase 2 safety-test tools; turn off once real tools exist
  system: true
  web: true
  browser: true
  media: true
  screen: true
  clipboard: true
  memory: true
  reminders: true
  agent_mode: true
  morning_briefing: false
  wake_word: true
