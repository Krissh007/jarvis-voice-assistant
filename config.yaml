# JARVIS configuration. Secrets go in .env, never here.

user:
  name: Sir                     # how JARVIS addresses you

voice:
  name: Charon                  # Live API prebuilt voice (accent/tone come from the persona prompt)

models:
  live: gemini-3.8-live         # stable Live model, free tier (docs checked 2026-09-24)
  flash: gemini-3.8-flash       # text sub-tasks, free tier (docs checked 2026-09-24)
  flash_fallbacks: [gemini-3.5-flash, gemini-3.5-flash-lite]   # tried in order when flash is overloaded
  thinking:                     # thinking level per text model (lower = faster); measured 2026-09-25
    gemini-3.8-flash: low       # 3.8 rejects "minimal"
    gemini-3.5-flash: minimal
    gemini-3.5-flash-lite: minimal
  openrouter: null              # e.g. a free OpenRouter model id; used only if OPENROUTER_API_KEY is set

groq:                           # the reasoning layer's model (features.brain); key: GROQ_API_KEY in .env
  # Tried in order; the last one also classifies unclear requests. Checked on this account 2026-10-17
  # (GET /openai/v1/models): the Llama models are gone; these three do tool calls. Free tier, from the
  # response headers: 1000 requests a day and 8000 tokens a minute each.
  models: [openai/gpt-oss-120b, qwen/qwen3.8-27b, openai/gpt-oss-20b]
  timeout_s: 15                 # per model call
  max_tokens: 700
  rpm: {openai/gpt-oss-120b: 30, qwen/qwen3.8-27b: 30, openai/gpt-oss-20b: 30}

brain:                          # ask_brain (features.brain): route, then reason with a few tools
  max_steps: 6                  # model calls per request
  budget_s: 45                  # whole request, not counting time waiting for the user's yes
  max_tool_calls_per_step: 4
  result_chars: 3000            # each tool result the model sees

reasoning:                      # think_through (features.reasoning): careful answers, web search optional
  thinking: high                # thinking level for these calls only (the Flash chain above, then fallbacks)
  max_tokens: 2000
  # Free tier, checked on this account 2026-10-16: Gemini Pro models have a limit of 0 and Google Search
  # grounding is refused, so think_through uses Flash + JARVIS's own search (Tavily, else DuckDuckGo).

condense:                       # long tool results (read_app, wait_for_app, job_search_status) are shortened
  over_chars: 1500              # before the Live model sees them; shorter results pass unchanged
  max_words: 120
  model: gemini-3.5-flash-lite  # tried first (spares the main Flash model's small daily quota)
  timeout_s: 5                  # slower than this: use the start and end of the text instead

chat_apps:                       # read_app what=latest and wait_for_app: the newest message, not the window
  max_chars: 6000               # longest reply returned (its start is kept)
  profiles:
    claude.exe:                 # Claude's chat view (checked 2026-10-16); other views fall back, with a warning
      container_role: feed      # web role of the message list ("Chat messages")
      message_role: article     # one per message
      message_name: 'Message (\d+) of (\d+)'
      streaming_name: '^Currently streaming message$'   # a reply still being written
      roles: {"You said:": you, "Claude responded:": claude}
      reply_role: claude
      skip_inside: [button, status]   # Copy, Retry, "Thought for 13s", screen-reader status lines
      drop_text: ['^Thought for \d+s$']

listening:
  mode: wake_word               # always_on | push_to_talk | wake_word
  end_pause_ms: 1000            # quiet this long = you've finished; shorter replies faster, but splits sentences

wake_word:
  model: hey_jarvis
  threshold: 0.25               # mic tests: your "hey jarvis" scores 0.2-0.5, silence stays under 0.05
  personal_verifier: true       # use data/wake/*_verifier.pkl from --train-wake when it exists
  verifier_threshold: 0.5       # wake threshold when the personal verifier is in use
  strict_margin: 0.10           # extra the voice model needs when the stock model scores ~0 (0.15 = fewer false wakes)
  gain: 1.0                     # boosts your voice for wake detection only; --mic-test suggests a value
  active_window_s: 15
  chime_volume: 0.06            # wake beep loudness, 0 = silent, 0.25 = the old level

ducking:                        # lower other apps (music) while JARVIS is awake; restored when it sleeps
  enabled: true
  level: 0.3                    # 0.3 = other apps play at 30% of their normal volume

noise_suppression:              # RNNoise, runs on this PC: cleans the audio sent to Gemini
  enabled: true
  strength: 1.0                 # 0..1; lower keeps more of the original sound
                                # the wake word always uses the raw mic (your voice model was trained on it)

window:                         # used when features.window is true
  always_on_top: true
  opacity: 1.0                  # below 1 lets windows behind show through
  close_button: quit            # the window's X: quit JARVIS, or "hide" to keep it running in the tray
  speak_typed_replies: true     # JARVIS says its answers to typed messages aloud (also in the window's menu)

web_ui:                         # used when features.web_ui is true: the orb and the chat page (ui/)
  port: 0                       # 0 = any free port; always 127.0.0.1, and every connection needs the launch's token
  window: true                  # show the orb: tap = talk, double-tap = control centre, drag it anywhere
  # The orb's look. These are the defaults: the Customize sliders in the control centre change them live and
  # keep your choices in data/orb_look.json, which wins over these (Reset goes back to these).
  orb_size: 112                 # how big the orb looks, in pixels (70 .. 260)
  core_size: 0.83               # the arc reactor core's size as a share of the cloud's (0.4 .. 1.0)
  orb_brightness: 0.55          # the arc reactor core and its glowing nucleus: 0.2 (faint) .. 1.0 (bright)
  cloud_brightness: 0.45        # the cloud of light points around it, on its own: 0.2 .. 1.0
  ribbon_brightness: 0.5        # the glowing Möbius ribbons around the cloud: 0.2 .. 1.0
  caption_seconds: 8            # voice mode: a reply's caption under the orb fades after this many seconds
  always_on_top: true
  close_button: quit            # closing the orb (Alt+F4) quits JARVIS, or "hide" keeps it running in the tray
  quick_actions:                # buttons in the control centre; each sends its text to JARVIS
    - "What's on my screen?"
    - "Play some music"
    - "What are my reminders?"
    - "How's my job search going?"
  chat_width: 1100              # the chat page's window ("New chat"), first time; then it remembers
  chat_height: 760

audio:
  transcription_languages: [en-IN]   # BCP-47 hints for your speech; [] = auto-detect
  input_device: null            # null = Windows default; or part of a device name, e.g. "Nord Buds"
  echo_mode: auto               # auto | headphones | speakers. auto guesses from the output device name.
                                # speakers: mic ignored while JARVIS talks (interrupt with the stop key)
  mute_mic_while_speaking: false
  echo_tail_ms: 400

hotkeys:
  mute: ctrl+alt+m
  push_to_talk: ctrl+alt+space
  stop: ctrl+alt+s
  confirm: ctrl+alt+y
  cancel: ctrl+alt+n

confirm:
  accept_phrases: [confirm, "yes", yes do it, go ahead, yeah, yep, sure, okay, ok]
  timeout_s: 20

apps:
  # friendly name -> what Windows should launch (App Paths names or a URL). Only these can be opened.
  allowlist:
    chrome: chrome.exe
    vs code: code.exe
    notepad: notepad.exe
    calculator: calc.exe
    file explorer: explorer.exe
    terminal: wt.exe
    word: winword.exe
    excel: excel.exe
    claude: shell:AppsFolder\Claude_pzs8sxrjxfjjc!Claude   # the Claude desktop app (Microsoft Store install)
  # other ways of saying the same app (exact match after lower-casing; nothing is guessed)
  aliases:
    google chrome: chrome
    browser: chrome
    visual studio code: vs code
    vscode: vs code
    code: vs code
    calc: calculator
    explorer: file explorer
    files: file explorer
    my files: file explorer
    windows terminal: terminal
    command prompt: terminal
    powershell: terminal
    microsoft word: word
    ms word: word
    microsoft excel: excel
    ms excel: excel
    claude app: claude
    claude desktop: claude
    anthropic claude: claude
    cloud: claude                # how "Claude" is often mis-heard
    cloud app: claude

sites:
  read_allowlist: [youtube.com, music.youtube.com, google.com, wikipedia.org]
  action_allowlist: [youtube.com, music.youtube.com, google.com, wikipedia.org]

weather:
  default_city: null            # used when you ask "what's the weather?" without a city

browser:
  channel: chrome               # your installed Google Chrome, with JARVIS's own profile in data/browser_profile
  headless: false               # show the window (needed to hear and see what it plays)

music:
  source: youtube_music_app      # your installed YouTube Music app; falls back to JARVIS's browser

files:                          # find_files / open_file (features.files): names only, never contents
  folders: [desktop, documents, downloads, pictures, music, videos]   # your Windows folders (follow OneDrive)
  extra_folders: []             # more folders to search, e.g. ["E:/Projects"]
  also_hide: []                 # more name patterns never listed or opened, e.g. ["*bank*"]
                                # always hidden: passwords, keys, 2FA/recovery codes, ID cards, card details
  max_results: 5

file_edit:                      # create, change and delete your text files (features.file_edit)
  folders: [desktop, documents, downloads]   # only files in these can be changed (never JARVIS's own folder)
  extra_folders: []             # more, e.g. ["E:/Projects"]
  max_kb: 200                   # largest file read or written
  backups: true                 # each change keeps the old version in data/file_backups (newest 200)
  editor: code                  # write_file open=true opens it in VS Code; empty = the file's usual app

task:                           # start_task: JARVIS keeps working on one job until it's done, then tells you
  max_rounds: 30                # "keep going" turns before it stops and reports what's left
  max_minutes: 30
  stall_rounds: 3               # turns in a row without using a tool = stuck: stop and say so
  pause_s: 2.0                  # quiet this long after each turn before carrying on (time for you to speak)

desktop:                        # read_app (features.desktop)
  max_items: 150                # buttons, fields and lines read from one window
  max_chars: 4000               # text read from documents and text boxes
  repeat_guard_s: 10            # the same text into the same window again this soon isn't typed twice
  max_typed: 2000               # longest text typed in one go (terminals, chat boxes, Notepad...)
  max_typed_editor: 10000       # into a code editor (VS Code...): a whole file in one paste

paths:
  research_dir: '%USERPROFILE%\Documents\jarvis'

limits:
  # Google no longer publishes free-tier numbers in the docs; they are shown per account at
  # https://aistudio.google.com/rate-limit . Copy yours here; null = no client-side limit.
  live: {rpm: null, tpm: null, rpd: null}
  flash: {rpm: null, tpm: null, rpd: 20}   # gemini-3.8-flash free tier: 20/day (from the API's 429, 2026-09-25)
  research_pages_max: 3
  agent_steps_max: 10
  agent_replans_max: 1
  browser_task_steps_max: 10
  page_cache_ttl_h: 24

memory:
  max_facts: 100                # remember() refuses when full; facts are listed in the system prompt
  embeddings: true              # search memory by meaning (model from main.py --setup-memory); false = keywords only

job_search:                     # used when features.job_search is true
  api_url: http://127.0.0.1:8000/api           # JobPilot's local API (GET only; must be this computer)
  sync_dir: E:/job_search_agent/project_sync   # only for the LinkedIn resume upload status

agent_hub:                      # used when features.agent_hub is true
  url: http://127.0.0.1:8765/mcp  # the Agent Hub's MCP endpoint (must be this computer); token: AGENT_HUB_TOKEN in .env
  poll_s: 5                     # how often to look for finished results
  request_timeout_s: 8          # per call to the Hub

briefing:                       # used when features.morning_briefing is true
  news_query: "top news today"  # e.g. "India news today"; weather needs weather.default_city

features:
  test_tools: false             # Phase 2 safety-test tools (the test suite turns them on itself)
  system: true
  web: true
  reasoning: false              # think_through (Flash, thinking high); replaced by brain, which falls back to it
  browser: true
  media: true
  app_ui: false                 # older app_ui_action (allowlisted apps, every step confirmed); replaced by desktop
  screen: true
  clipboard: true
  files: true                   # find and open your own files by name
  file_edit: true               # create, change and delete (to the Recycle Bin, asks first) your text files
  desktop: true                 # read, type, click, keys, scroll, move windows in open apps (never browsers, passwords)
  memory: true
  reminders: true
  agent_mode: true
  job_search: true                # "how's my job search?" reads JobPilot (read only)
  brain: true                  # ask_brain: Groq reasoning with a few tools (falls back to Flash)
  agent_hub: true               # shortlist, approvals, job search runs, approve/skip through the Agent Hub (needs it running + AGENT_HUB_TOKEN)
  morning_briefing: false
  tray: true                    # tray icon: click to talk, Stop, Mute, Quit
  window: false                 # the older Tk window (orb, captions, typing box); used only when web_ui is off
  web_ui: true                  # the orb (quick-action control centre) and the chat page (New chat)
  wake_word: true
