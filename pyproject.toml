[project]
name = "jarvis"
version = "0.1.0"
description = "Personal voice assistant for Windows on the Gemini Live API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ddgs>=9.16.0",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "playwright>=1.63.0",
    "psutil>=7.2.2",
    "pycaw>=20260921",
    "pynput>=1.8.2",
    "python-dotenv>=1.2.3",
    "pyyaml",
    "sounddevice>=0.5.6",
    "trafilatura>=2.2.0",
]

[project.optional-dependencies]
wakeword = [
    "openwakeword>=0.6",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
