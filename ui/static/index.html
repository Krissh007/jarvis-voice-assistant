<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="orb-wrap">
        <canvas id="orb" class="orb" width="220" height="220" title="Click to talk"></canvas>
        <div id="state" class="state">Connecting…</div>
      </div>
      <div class="controls">
        <button data-action="talk" title="Talk to JARVIS (Ctrl+Alt+Space)">Talk</button>
        <button data-action="sleep" title="Stop listening until the wake word">Sleep</button>
        <button data-action="mute" id="mute" title="Mute the microphone (Ctrl+Alt+M)">Mute</button>
        <button data-action="stop" title="Stop talking or the running action (Ctrl+Alt+S)">Stop</button>
      </div>
      <section id="confirm" class="card confirm" hidden>
        <h2>Should I go ahead?</h2>
        <p id="confirm-text"></p>
        <div class="row">
          <button data-action="confirm" class="primary">Confirm</button>
          <button data-action="cancel">Cancel</button>
        </div>
      </section>
      <section class="card vision">
        <h2>Vision</h2>
        <p class="dim" id="vision-text">Off. JARVIS only sees your screen when you ask it to look.</p>
      </section>
    </aside>

    <main class="chat">
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="composer" class="composer" autocomplete="off">
        <textarea id="input" rows="2" maxlength="2000" placeholder="Type a message to JARVIS…"></textarea>
        <div class="composer-row">
          <label class="toggle"><input type="checkbox" id="speak"> Speak replies</label>
          <button type="submit" class="primary">Send</button>
        </div>
      </form>
    </main>

    <aside class="activity">
      <h2>Activity</h2>
      <ol id="steps" class="steps"></ol>
      <p id="steps-empty" class="dim">Tools JARVIS runs and the steps of a plan show up here.</p>
    </aside>
  </div>
  <footer class="footer"><span id="conn" class="conn off"></span><span id="status" class="dim"></span></footer>
  <script src="/static/app.js"></script>
</body>
</html>
