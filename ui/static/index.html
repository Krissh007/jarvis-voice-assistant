<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div id="stage">
    <canvas id="orb" aria-label="JARVIS. Tap to talk, double-tap for the control centre, drag to move."></canvas>
    <div id="panel" hidden>
      <div id="controls" role="toolbar" aria-label="Controls">
        <button data-action="talk" title="Talk (Ctrl+Alt+Space)">Talk</button>
        <button data-action="mute" id="mute" title="Mute the microphone (Ctrl+Alt+M)">Mute</button>
        <button data-action="new_chat" class="accent" title="Start a new chat in the full chat window">New chat</button>
        <button data-action="stop" class="red" title="Stop (Ctrl+Alt+S)">Stop</button>
        <button data-action="sleep" title="Go to sleep">Sleep</button>
        <button data-action="voice" id="voice" aria-pressed="true"
          title="Speak replies aloud. Off: JARVIS answers in text only, here and in the chat">Voice: on</button>
        <button data-action="announce" id="announce" aria-pressed="true"
          title="Announce agent results, reminders and the morning briefing aloud. Off: shown here, not spoken">Announce: on</button>
        <button type="button" id="customize" title="Change the orb's size and brightness" aria-expanded="false">Customize</button>
      </div>
      <div id="look" class="card" hidden>
        <h2>Customize the orb</h2>
        <label class="slider">Orb size <input type="range" data-key="orb_size" min="70" max="260" step="2"><output></output></label>
        <label class="slider">Core size <input type="range" data-key="core_size" min="40" max="100" step="1"><output></output></label>
        <label class="slider">Core brightness <input type="range" data-key="orb_brightness" min="20" max="100" step="1"><output></output></label>
        <label class="slider">Cloud brightness <input type="range" data-key="cloud_brightness" min="20" max="100" step="1"><output></output></label>
        <label class="slider">Ribbon brightness <input type="range" data-key="ribbon_brightness" min="20" max="100" step="1"><output></output></label>
        <div class="row"><button type="button" class="pill" id="lookReset">Reset</button><button type="button" class="pill yes" id="lookDone">Done</button></div>
      </div>
      <div id="sections" aria-live="polite"></div>
      <form id="composer" autocomplete="off">
        <button type="button" id="talk" class="icon" title="Talk to JARVIS" aria-label="Talk"><span class="mic"></span></button>
        <input id="input" maxlength="2000" placeholder="Ask JARVIS to do something…" aria-label="Message to JARVIS">
        <button type="button" id="speak" class="icon toggle" title="Speak replies aloud" aria-pressed="true" aria-label="Speak replies">
          <span class="spk"></span></button>
      </form>
      <div id="quick" aria-label="Quick actions"></div>
      <div id="status" class="dim"></div>
    </div>
  </div>
  <script src="/static/orb.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
