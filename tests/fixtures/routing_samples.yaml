# Labelled requests for core/router.py. `route` is the expected route; `ok` lists other routes that are
# also fine (one clear tool vs several candidates is a judgement call); `tool` must be among the
# attached tools. Used by tests/test_router.py (accuracy floors).
samples:
  # one clear skill
  - {text: "what's the weather in Hyderabad", route: skill, tool: jarvis.get_weather}
  - {text: "will it rain tomorrow in Pune", route: skill, tool: jarvis.get_weather}
  - {text: "play believer by imagine dragons", route: skill, tool: jarvis.play_music}
  - {text: "pause the music", route: skill, ok: [tools], tool: jarvis.media_key}
  - {text: "what's my battery level", route: skill, tool: jarvis.get_system_status}
  - {text: "what time is it", route: skill, ok: [tools], tool: jarvis.get_datetime}
  - {text: "remind me to drink water in 20 minutes", route: skill, tool: jarvis.set_reminder}
  - {text: "what reminders do I have", route: skill, ok: [tools], tool: jarvis.list_reminders}
  - {text: "what's on my shortlist", route: skill, tool: jobpilot.get_shortlist}
  - {text: "approve application 12", route: skill, ok: [tools], tool: jobpilot.approve_application}
  - {text: "skip application 4", route: skill, ok: [tools], tool: jobpilot.skip_application}
  - {text: "which applications are waiting for my approval", route: skill, ok: [tools], tool: jobpilot.get_review_queue}
  - {text: "run the job discovery now", route: skill, ok: [tools], tool: jobpilot.run_agent}
